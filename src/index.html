<!doctype html>
<html lang="uk">

    <meta charset="utf-8" />
    <title>Temnorid — Dark Medieval Fantasy World</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const storedMode = localStorage.getItem('app-mode');
        const preferredMode =
          storedMode === 'dark' || storedMode === 'light'
            ? storedMode
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-mode', preferredMode);
      } catch {}
    </script>

    <meta
      name="description"
      content="Explore Temnorid, a dark medieval fantasy world inspired by the 14th century, where kingdoms, armies and wizards fight with steel, elemental magic and strategy."
