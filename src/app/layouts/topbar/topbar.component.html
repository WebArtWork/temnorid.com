<header class="t-bar t-rule-b relative z-50">
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between gap-3 overflow-visible px-4 py-[var(--t-bar-y)] sm:px-6"
	>
		<div class="flex items-center gap-4 sm:gap-6">
			<a class="theme-focus t-wordmark rounded-md text-xl sm:text-2xl" routerLink="/">
				<span translate>Темнорід</span>
			</a>

			<nav class="hidden lg:block" [translate]="{ ariaLabel: 'Основна навігація' }">
				<ul class="flex items-center gap-5">
					@for (link of navLinks; track link.path) {
						<li>
							<a
								class="theme-interactive theme-focus rounded-md py-2 font-medium text-[var(--c-text)] hover:text-[var(--c-text-strong)]"
								[routerLink]="link.path"
								routerLinkActive="text-[var(--c-primary-text)] underline underline-offset-8"
								ariaCurrentWhenActive="page"
								[translate]="link.label"
							>
								{{ link.label }}
							</a>
						</li>
					}
				</ul>
			</nav>
		</div>

		<div class="flex items-center gap-2">
			<button
				class="theme-interactive theme-focus inline-flex h-11 items-center justify-center rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-3 hover:bg-[var(--c-bg-tertiary)]"
				[attr.aria-label]="languageCycleLabel()"
				(click)="nextLanguage()"
				type="button"
			>
				<img
					class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
					[alt]="currentLanguage().nativeName"
					[ngSrc]="currentLanguage().flagSrc"
					width="28"
					height="20"
				/>
			</button>

			<button
				class="theme-interactive theme-focus inline-flex h-11 w-11 items-center justify-center rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)]"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
				type="button"
			>
				<span class="material-symbols-outlined text-[22px]" aria-hidden="true">
					{{ toggleIcon() }}
				</span>
			</button>
			<button
				class="theme-interactive theme-focus inline-flex h-11 w-11 items-center justify-center rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)] lg:hidden"
				[attr.aria-expanded]="menuOpen()"
				[attr.aria-label]="menuLabel()"
				aria-controls="topbar-menu"
				(click)="toggleMenu()"
				type="button"
			>
				<span class="material-symbols-outlined text-[22px]" aria-hidden="true">
					{{ menuOpen() ? 'close' : 'menu' }}
				</span>
			</button>
		</div>
	</div>

	@if (menuOpen()) {
		<nav
			id="topbar-menu"
			class="t-rule-t lg:hidden"
			[translate]="{ ariaLabel: 'Основна навігація' }"
		>
			<ul class="mx-auto max-w-[var(--container)] px-4 py-2 sm:px-6">
				@for (link of navLinks; track link.path) {
					<li>
						<a
							class="theme-interactive theme-focus flex min-h-12 items-center rounded-md px-2 text-lg font-medium text-[var(--c-text)] hover:text-[var(--c-text-strong)]"
							[routerLink]="link.path"
							routerLinkActive="text-[var(--c-primary-text)]"
							ariaCurrentWhenActive="page"
							(click)="menuOpen.set(false)"
							[translate]="link.label"
						>
							{{ link.label }}
						</a>
					</li>
				}
			</ul>
		</nav>
	}
</header>
